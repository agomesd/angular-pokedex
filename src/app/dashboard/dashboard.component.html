<section class="mx-auto flex w-full max-w-3xl flex-col gap-4 p-4">
  <div class="flex flex-col gap-1">
    <h1 class="text-2xl font-semibold">My team</h1>
    <p id="team-reorder-hint" class="text-muted-foreground text-sm">
      Drag a Pokémon onto a slot, or focus one and use the arrow keys.
    </p>
  </div>

  <ul class="grid grid-cols-3 gap-3 sm:gap-4" aria-label="Team slots">
    @for (slot of slots(); track $index; let index = $index) {
      <li
        appTeamSlot
        [index]="index"
        [member]="slot"
        [dragging]="dragging() === index"
        [dropTarget]="over() === index && dragging() !== null && dragging() !== index"
        (dragover)="dragOver(index, $event)"
        (drop)="drop(index, $event)"
        (dragStarted)="dragStart(index, $event)"
        (dragEnded)="dragEnd()"
        (pointerPressed)="pointerDown(index, $event)"
        (pointerMoved)="pointerMove($event)"
        (pointerReleased)="pointerUp($event)"
        (pointerCancelled)="pointerCancel($event)"
        (reorderKey)="onKeydown(index, $event)"
        (remove)="remove($event)"
      ></li>
    }
  </ul>
</section>
