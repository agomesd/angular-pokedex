<hlm-card>
  <hlm-card-header>
    <div class="flex h-8 items-center justify-between gap-2">
      <div class="flex min-w-0 items-center gap-1.5">
        <span class="text-muted-foreground inline-block w-14 shrink-0 text-right text-sm font-semibold tabular-nums">
          @if (pokemon(); as p) {
            #{{ p.id }}
          }
        </span>
        <h3 hlmCardTitle class="truncate">{{ name() | titlecase }}</h3>
      </div>
      <div class="flex h-8 w-[4.25rem] shrink-0 items-center justify-end gap-1">
        @for (type of typeBadges(); track type.name) {
          <app-pokemon-type-badge [name]="type.name" [icon]="type.icon" />
        }
      </div>
    </div>
  </hlm-card-header>
  <div hlmCardContent>
    <div class="relative h-32 w-32 rounded-2xl bg-[url('/pokemon-landscap.jpg')] bg-cover bg-center p-2">
      @if (pokemon(); as p) {
      @if (pokemonSprite(p); as src) {
      <app-pokemon-sprite [src]="src" [alt]="name() | titlecase" />
      }
      }
    </div>

  </div>
  <div hlmCardFooter class="flex w-full flex-row items-center gap-2">
    @if (pokemon(); as p) {
      <app-add-to-team
        class="min-w-0 flex-1"
        [pokemonId]="p.id"
        [name]="p.name"
        [sprite]="pokemonSprite(p)"
        [fullWidth]="true"
        [explainFull]="false"
        [fullTooltip]="true"
      />
    } @else {
      <button hlmBtn type="button" class="min-w-0 flex-1" disabled>Add to team</button>
    }
    <app-pokemon-detail-sheet [pokemon]="pokemon() ?? null" [types]="pokemonTypes()" [name]="name()" />
  </div>
</hlm-card>
