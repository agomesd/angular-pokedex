<hlm-card>
  <hlm-card-header>
    <div class="flex items-center justify-between ">
      <h3 hlmCardTitle>{{ name() | titlecase }}</h3>
      <div class="flex h-9 shrink-0 items-center gap-2 rounded-full border border-gray-200 pr-0.5 pl-2">
        @if (primaryTypeName(); as type) {
        <span [class]="'text-sm font-medium ' + typeColour(type)">{{ type | titlecase }}</span>
        }
        <span class="grid size-8 shrink-0 place-items-center">
          @if (primaryTypeIcon(); as icon) {
          <img
            #typeIcon
            [ngSrc]="icon"
            alt=""
            width="32"
            height="32"
            class="col-start-1 row-start-1 size-8 rounded-full"
            [class.opacity-0]="!typeIconReady(icon)"
            (load)="onTypeIconLoad(icon)"
            (error)="onTypeIconError(icon)"
          />
          }
          @if (showTypeSpinner()) {
          <hlm-spinner class="col-start-1 row-start-1" aria-label="Loading type" />
          }
        </span>
      </div>
    </div>
  </hlm-card-header>
  <div hlmCardContent>
    <div class="w-32 h-32 relative bg-indigo-200 rounded-2xl p-2">
      @if (pokemon(); as p) {
      @if (pokemonSprite(p); as src) {
      <app-pokemon-sprite [src]="src" [alt]="name() | titlecase" />
      }
      }
    </div>

  </div>
  <div hlmCardFooter class="w-full">
    <hlm-sheet side="right" class="w-full">
      <button hlmBtn variant="outline" hlmSheetTrigger class="w-full">View details</button>
      <ng-template brnSheetContent>
        <hlm-sheet-content class="overflow-y-auto sm:max-w-md">
          @if (pokemon(); as p) {
          <app-pokemon-details [pokemon]="p" [types]="pokemonTypes()" />
          } @else {
          <div hlmSheetHeader>
            <h2 hlmSheetTitle>Loading details</h2>
            <p hlmSheetDescription>Fetching this Pokémon.</p>
          </div>
          }
        </hlm-sheet-content>
      </ng-template>
    </hlm-sheet>
  </div>
</hlm-card>
