<hlm-card>
  <hlm-card-header>
    <div class="flex items-center justify-between ">
      <h3 hlmCardTitle>{{ name() | titlecase }}</h3>
      <div class="flex h-9 shrink-0 items-center gap-2 rounded-full border border-gray-200 pr-0.5 pl-2">
        @if (primaryTypeName(); as type) {
        <span [class]="'text-sm font-medium ' + typeColour(type)">{{ type | titlecase }}</span>
        }
        <span class="grid size-8 shrink-0 place-items-center">
          @if (primaryTypeIcon(); as icon) {
          <img
            #typeIcon
            [ngSrc]="icon"
            alt=""
            width="32"
            height="32"
            class="col-start-1 row-start-1 size-8 rounded-full"
            [class.opacity-0]="!typeIconReady(icon)"
            (load)="onTypeIconLoad(icon)"
            (error)="onTypeIconError(icon)"
          />
          }
          @if (showTypeSpinner()) {
          <hlm-spinner class="col-start-1 row-start-1" aria-label="Loading type" />
          }
        </span>
      </div>
    </div>
  </hlm-card-header>
  <div hlmCardContent>
    <div class="relative h-32 w-32 rounded-2xl bg-[url('/pokemon-landscap.jpg')] bg-cover bg-center p-2">
      @if (pokemon(); as p) {
      @if (pokemonSprite(p); as src) {
      <app-pokemon-sprite [src]="src" [alt]="name() | titlecase" />
      }
      }
    </div>

  </div>
  <div hlmCardFooter class="flex w-full flex-row items-center gap-2">
    @if (pokemon(); as p) {
      <app-add-to-team
        class="min-w-0 flex-1"
        [pokemonId]="p.id"
        [name]="p.name"
        [sprite]="pokemonSprite(p)"
        [fullWidth]="true"
        [explainFull]="false"
        [fullTooltip]="true"
      />
    } @else {
      <button hlmBtn type="button" class="min-w-0 flex-1" disabled>Add to team</button>
    }
    <app-pokemon-detail-sheet [pokemon]="pokemon() ?? null" [types]="pokemonTypes()" [name]="name()" />
  </div>
</hlm-card>
