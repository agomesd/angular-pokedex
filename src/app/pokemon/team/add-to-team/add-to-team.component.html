<div class="flex flex-col gap-2" [class.w-full]="fullWidth()">
  @if (onTeam()) {
    <button
      hlmBtn
      type="button"
      [variant]="appearance()"
      class="cursor-pointer"
      [class.w-full]="fullWidth()"
      [class.rounded-xl]="rounded()"
      (click)="remove()"
    >
      Remove from team
    </button>
  } @else {
    <hlm-dialog class="block" [class.w-full]="fullWidth()" (stateChanged)="onDialogState($event)">
      @if (teamFull() && fullTooltip()) {
        <span class="block w-full" tabindex="0" [brnTooltip]="fullTeamMessage" position="bottom">
          <button
            hlmBtn
            type="button"
            [variant]="appearance()"
            class="pointer-events-none w-full"
            [class.rounded-xl]="rounded()"
            disabled
            [attr.aria-describedby]="'team-full-' + pokemonId()"
          >
            Add to team
          </button>
        </span>
        <span [id]="'team-full-' + pokemonId()" class="sr-only">{{ fullTeamMessage }}</span>
      } @else {
      <button
        hlmBtn
        hlmDialogTrigger
        type="button"
        [variant]="appearance()"
        class="cursor-pointer"
        [class.w-full]="fullWidth()"
        [class.rounded-xl]="rounded()"
        [disabled]="teamFull()"
      >
        Add to team
      </button>
      }
      <ng-template brnDialogContent>
        <hlm-dialog-content>
          <div hlmDialogHeader>
            <h2 hlmDialogTitle>Add {{ name() | titlecase }}</h2>
            <p hlmDialogDescription>Give this Pokémon a nickname and a role on your team.</p>
          </div>
          <app-team-member-form
            [id]="'team-' + pokemonId()"
            submitLabel="Add to team"
            [error]="addError()"
            (submitted)="submit($event)"
          />
        </hlm-dialog-content>
      </ng-template>
    </hlm-dialog>
  }
  @if (explainFull() && teamFull()) {
    <p role="status" class="text-muted-foreground text-sm">
      {{ fullTeamMessage }}
    </p>
  }
</div>
