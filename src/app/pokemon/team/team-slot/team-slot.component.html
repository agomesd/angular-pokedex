<span
  class="pointer-events-none absolute top-2 left-3 z-10 flex items-center gap-1 rounded-full bg-white/70 py-1 text-xs font-semibold text-indigo-950 sm:text-sm"
  [class.w-fit]="!member()"
  [class.px-4]="!member()"
  [class.right-14]="!!member()"
  [class.ps-4]="!!member()"
  [class.pe-1]="!!member()">
  <span>{{ index() + 1 }}</span>
  @if (member(); as member) {
  <span class="min-w-0 truncate font-medium">{{ member.nickname }}</span>
  <hlm-dialog class="pointer-events-auto ms-auto inline-flex shrink-0" (stateChanged)="onNicknameDialog($event)">
    <button hlmBtn hlmDialogTrigger type="button" variant="ghost" size="icon-xs"
      class="cursor-pointer text-indigo-950 rounded-full" [attr.aria-label]="'Edit nickname for ' + member.nickname"
      (pointerdown)="$event.stopPropagation()" (click)="$event.stopPropagation()">
      <ng-icon name="lucidePencil" />
    </button>
    <ng-template brnDialogContent>
      <hlm-dialog-content>
        <div hlmDialogHeader>
          <h2 hlmDialogTitle>Edit nickname</h2>
          <p hlmDialogDescription>Nicknames are 3 to 12 characters.</p>
        </div>
        <app-team-member-form [id]="'team-nickname-edit-' + index()" submitLabel="Save" [showRole]="false"
          [nickname]="member.nickname" [error]="nicknameSaveError()" (submitted)="saveNickname($event)" />
      </hlm-dialog-content>
    </ng-template>
  </hlm-dialog>
  }
</span>
@if (member(); as member) {
@if (typeIcons().length) {
<div class="absolute bottom-2 left-3 z-10 flex items-center gap-1" (pointerdown)="$event.stopPropagation()"
  (dragstart)="$event.preventDefault(); $event.stopPropagation()">
  @for (type of typeIcons(); track type.name) {
  <app-pokemon-type-badge [name]="type.name" [icon]="type.icon" size="sm" position="top" />
  }
</div>
}
<div data-reorder tabindex="0" draggable="true"
  class="flex h-full cursor-grab touch-none flex-col items-center justify-center gap-1 rounded-2xl px-2 pt-6 pb-12 outline-none focus-visible:ring-2 focus-visible:ring-ring active:cursor-grabbing"
  (dragstart)="dragStarted.emit($event)" (dragend)="dragEnded.emit()"
  [attr.aria-label]="member.nickname + ', ' + (member.name | titlecase) + ', ' + member.role + ', slot ' + (index() + 1)"
  aria-describedby="team-reorder-hint" [attr.aria-grabbed]="dragging()" (pointerdown)="pointerPressed.emit($event)"
  (pointermove)="pointerMoved.emit($event)" (pointerup)="pointerReleased.emit($event)"
  (pointercancel)="pointerCancelled.emit($event)" (keydown)="reorderKey.emit($event)">
  @if (member.sprite; as src) {
  <span class="relative size-28 min-[30rem]:size-20 sm:size-28">
    <app-pokemon-sprite [src]="src" [alt]="member.name | titlecase" />
  </span>
  } @else {
  <img src="/pokeball.png" alt="" width="96" height="96" draggable="false" class="size-24 min-[30rem]:size-20 sm:size-24" />
  }
</div>
<app-select class="absolute top-2 right-3 z-20" appearance="icon" [controlId]="'team-slot-role-' + index()"
  [options]="roleOptions" [value]="member.role" [ariaLabel]="'Change role, currently ' + member.role"
  [tooltip]="member.role" (valueChange)="selectRole($event)" (openChange)="roleMenuOpen.set($event)"
  (pointerdown)="$event.stopPropagation()" (dragstart)="$event.preventDefault(); $event.stopPropagation()" />
<div
  class="absolute right-0 bottom-0 z-10 flex max-w-full flex-wrap items-center justify-end gap-2 rounded-tl-3xl bg-white/70 p-2"
  role="group" [attr.aria-label]="(member.name | titlecase) + ' actions'" (pointerdown)="$event.stopPropagation()"
  (dragstart)="$event.preventDefault(); $event.stopPropagation()">
  <button hlmBtn type="button" variant="outline" size="icon-sm" class="cursor-pointer rounded-xl"
    [attr.aria-label]="'Remove ' + (member.name | titlecase) + ' from team'" (click)="remove.emit(member.id)">
    <ng-icon name="lucideTrash2" />
  </button>
  <a hlmBtn variant="outline" size="icon-sm" class="cursor-pointer rounded-xl" [routerLink]="['/compare', member.id]"
    [attr.aria-label]="'Compare ' + (member.name | titlecase)">
    <ng-icon name="lucideGitCompareArrows" />
  </a>
  <app-pokemon-detail-sheet trigger="icon" [pokemonId]="member.id" [name]="member.name" />
</div>
} @else {
<a routerLink="/pokemon"
  class="flex h-full cursor-pointer items-center justify-center rounded-2xl outline-none focus-visible:ring-2 focus-visible:ring-ring"
  [attr.aria-label]="'Open Pokédex, slot ' + (index() + 1)">
  <img src="/pokeball.png" alt="" width="96" height="96" draggable="false" class="size-24 min-[30rem]:size-20 opacity-80 sm:size-24" />
</a>
}
